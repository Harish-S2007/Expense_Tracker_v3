
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: expense-v3-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-v3
  template:
    metadata:
      labels:
        app: expense-v3
    spec:
      containers:
        - name: expense-v3
          image: expense-tracker:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATA_DIR
              value: /app/data
          volumeMounts:
            - name: expense-v3-storage
              mountPath: /app/data
      volumes:
        - name: expense-v3-storage
          persistentVolumeClaim:
            claimName: expense-v3-data
---
apiVersion: v1
kind: Service
metadata:
  name: expense-v3-service
spec:
  type: NodePort
  selector:
    app: expense-v3
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30083
